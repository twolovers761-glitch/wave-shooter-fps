<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웨이브 슈터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="vignette"></div>

  <div id="crosshair">
    <span class="ch-line ch-top"></span>
    <span class="ch-line ch-bottom"></span>
    <span class="ch-line ch-left"></span>
    <span class="ch-line ch-right"></span>
    <span class="ch-dot"></span>
  </div>
  <div id="hit-marker"></div>

  <div id="hud">
    <div id="health-wrap">
      <div id="health-label">HP</div>
      <div id="health-bar"><div id="health-fill"></div></div>
      <div id="health-num">100</div>
    </div>
    <div id="mid-stats">
      <div id="score">SCORE <span id="score-val">0</span></div>
      <div id="wave">WAVE <span id="wave-val">1</span></div>
    </div>
    <div id="weapon"><span class="weapon-dot"></span><span id="weapon-label">GUN</span></div>
  </div>

  <div id="start-screen">
    <div class="panel">
      <h1>WAVE SHOOTER</h1>
      <div class="controls-grid">
        <div><b>WASD</b><span>이동</span></div>
        <div><b>마우스</b><span>시점 조작</span></div>
        <div><b>클릭</b><span>사격 / 공격</span></div>
        <div><b>SPACE</b><span>점프</span></div>
        <div><b>CTRL</b><span>앉기</span></div>
        <div><b>휠</b><span>무기 변경</span></div>
      </div>
      <p class="sub">적이 다가오기 전에 쏴서 처치하세요. 웨이브가 지날수록 더 많이, 더 빠르게 몰려옵니다.</p>
      <button id="start-btn">클릭해서 시작</button>
    </div>
  </div>

  <div id="gameover-screen" class="hidden">
    <div class="panel">
      <h1 class="danger">GAME OVER</h1>
      <p id="final-score">SCORE 0</p>
      <button id="restart-btn">다시 시작</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
